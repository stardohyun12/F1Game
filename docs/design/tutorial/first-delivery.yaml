    steps:

      - id: room
        title_ko: 아침, 주인공 방
        place: room
        actors: [protagonist]
        lines:
          - who: radio
            text: "…선두, 해안 직선으로 들어섭니다!"
          - who: radio
            text: "지역 소식입니다. 가을 축제 해안도로 레이스, 참가 신청은 정비소에서."
          - who: protagonist
            text: "(달력에 동그라미) …올해는 나간다."
        condition: 라디오 중계가 끝나면 조끼가 반짝임. 조끼를 집으면 다음(30~60초, 아무 키 건너뛰기)
        camera: 1인칭 또는 고정 카메라. 창밖 만이 보이는 각도. 포스터·달력·조끼가 한 화면에
        sound: 낡은 라디오 F1 중계(엔진·관중은 CC0, 해설은 자막) → 끝나면 창밖 갈매기·멀리 오토바이
        capture: null
        status: draft

      - id: door
        marker_world: [-117.7, -10.3]   # D-198 방 정면
        title_ko: 현관 — 첫 엽서 장면
        place: room
        actors: [protagonist]
        lines:
          - who: protagonist
            text: "좋아. 오늘부터다."
        condition: 계단 내려와 문 열기(자동) → 2~3초 동안 아침 마을·바다가 열림 → 걸어서 정비소로(길 안내 없음, 셔터 소리가 들림)
        camera: 문이 열리며 카메라가 뒤에서 어깨 너머로 → 만·지붕·바다 (TASTE 2 "좁은 곳 → 트인 곳")
        sound: 라디오가 멀어지고 동네 소리(갈매기·빨래·멀리 스쿠터)가 들어옴
        capture: null
        status: draft

      - id: garage
        title_ko: 정비소 — 사장이 고카트를 내줌
        place: garage
        actors: [protagonist, garage_boss]
        lines:
          - who: garage_boss
            text: "왔냐. 오늘부터 배달이다. 대회는 그 다음."
          - who: garage_boss
            text: "뒤에 짐상자 달아 놨어. 깨지는 건 네 책임."
          - who: protagonist
            text: "…네. 다녀올게요."
        condition: 셔터가 올라가면 고카트 등장(D-160). 사장 말풍선 2줄 → 차에 타면 다음. 벽의 대회 포스터 + 빈 칸 3개(차·실력·응원)가 보임
        camera: 셔터 앞 고정 → 카메라가 차 뒤로 내려와 플레이 시점(카메라 B)
        sound: 셔터 올라가는 소리, 공구, 엔진 첫 시동(크게)
        capture: docs/qa/evidence/townv6-loop/tut_1_garage_start.png
        status: draft

      - id: depot
        marker_world: [-45.0, -14.1]   # D-198 포장 지점(길46, TUT_PackTrigger)
        title_ko: 택배 보관소 — 달걀 포장
        place: depot
        actors: [protagonist, depot_clerk]
        lines:
          - who: depot_clerk
            text: "여기야, 여기! 첫 주문. 달걀 한 판, 언덕 위 찻집."
          - who: depot_clerk
            text: "빈 데 없이 꼭꼭 싸 줘. 깨지면 돈 못 받아."
        condition: 보관소 40m 안에 들어오면 직원이 손짓(말풍선 1). 차를 세우면 포장 미니게임(짧게) → 포장 끝나면 출발. 광장은 어디로든 갈 수 있음(D-138), 바닥 화살표 없음, 찻집 간판·표지판만
        camera: 포장 화면(피트스탑 느낌) → 끝나면 카메라 B
        sound: 창구 종, 테이프 찢는 소리, 상자 닫히는 소리
        capture: docs/qa/evidence/townv6-loop/tut_2_depot_packing.png
        status: draft

      - id: uphill
        marker_world: [116.0, -37.5]
        title_ko: 상점가 오르막 — 첫 흔들림
        place: uphill_street
        actors: [protagonist]
        lines:
          - who: protagonist
            text: "살살… 달걀이 흔들려."
        condition: 첫 큰 흔들림(화물 게이지 한 칸)에서 말풍선 1번만. 속도 vs 흔들림을 몸으로 배움. 오르막은 시야가 좁음(가게·전선·처마)
        camera: 카메라 B. 오르막에서 앞이 막혀 있다가 꼭대기에서 열리게(TASTE 해체 2)
        sound: 엔진 낮게, 돌길 덜컹, 가게 종·사람 말소리 조각
        capture: docs/qa/evidence/townv6-loop/tut_5_uphill_bubble.png
        status: draft

      - id: teahouse
        marker_world: [181.4, 5.7]
        title_ko: 언덕 찻집 도착 — 줄리아
        place: teahouse
        actors: [protagonist, julia]
        lines:
          - who: julia
            text: "어머, 왔네! 정비소 새 배달이지? 다 들었어."
          - who: julia
            text: "(안 깨짐) 하나도 안 깨졌네. 다음엔 차 한 잔 하고 가."
          - who: julia
            text: "(깨짐) 아이고, 몇 개 갔네. 괜찮아, 오믈렛 하면 돼. 다음엔 살살 와."
        condition: 찻집 앞에 서면 줄리아가 나옴. 화물 상태별 한 줄 + 몸짓. 뒤로 바다·마을이 열림(세계의 큰 소리 — 파도·바람)
        camera: 도착 컷 3~4초(찻집 앞, 뒤로 만이 보이는 각도) → 카메라 B
        sound: 찻집 문 종, 찻잔, 바람·멀리 파도(크게 한 번)
        capture: docs/qa/evidence/townv6-loop/tut_6_arrive_tea.png
        status: draft

      - id: coast
        marker_world: [91.7, -184.9]
        title_ko: 해안 귀환 · 정산
        place: coast_road
        actors: [protagonist, garage_boss]
        lines:
          - who: garage_boss
            text: "안 깨뜨렸네. 참가비까지는… 아직 멀었다."
          - who: garage_boss
            text: "내일도 와라."
        condition: 시계 없음. 해안 직선 끝 표지판까지 구간 기록만 조용히 표시(5초). 정비소에 들어오면 정산 화면(배달비·포장비·저금통·참가비까지 남은 금액)
        camera: 해안 직선은 카메라 B(조금 뒤로·낮게), 정산은 정비소 안 고정 컷(벽 포스터·저금통)
        sound: 엔진 낮춤, 바람·파도·먼 오토바이, 잔잔한 곡(D-129). 정산은 동전 소리 한 번
        capture: docs/qa/evidence/townv6-loop/tut_7_coast.png
