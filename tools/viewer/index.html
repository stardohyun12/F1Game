<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>PitCrew 건물 뷰어</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1f24; color: #e8e6e1;
    font: 14px/1.4 "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
  #app { display: flex; height: 100%; }
  #panel { width: 190px; flex: none; padding: 12px; box-sizing: border-box; background: #23282e;
    border-right: 1px solid #333a42; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
  #panel h1 { font-size: 15px; margin: 0 0 4px; color: #f3d9a4; }
  #list button, .modes button, #reload { width: 100%; text-align: left; padding: 7px 9px; border: 1px solid #3b434c;
    background: #2c3239; color: inherit; border-radius: 4px; cursor: pointer; font: inherit; }
  #list { display: flex; flex-direction: column; gap: 4px; }
  #list button.on, .modes button.on { background: #5b4a2c; border-color: #c9a35a; }
  #list button small { color: #9aa3ad; display: block; font-size: 11px; }
  .modes { display: flex; gap: 4px; }
  .modes button { text-align: center; }
  label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  input[type=range] { width: 100%; }
  #info { font-size: 11px; color: #9aa3ad; white-space: pre-line; }
  #view { position: relative; flex: 1; min-width: 0; min-height: 0; overflow: hidden; background: #111; }
  #c { display: block; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
  #c.pixel { image-rendering: pixelated; image-rendering: crisp-edges; }
  #help { position: absolute; left: 0; right: 0; bottom: 0; padding: 6px 10px; background: rgba(0,0,0,.55);
    font-size: 13px; pointer-events: none; }
  #side { width: 270px; flex: none; padding: 12px; box-sizing: border-box; background: #23282e; border-left: 1px solid #333a42;
    display: flex; flex-direction: column; gap: 8px; overflow-y: auto; font-size: 13px; }
  #side > * { flex-shrink: 0; }
  #side h2 { font-size: 14px; margin: 0; color: #f3d9a4; }
  #side button { padding: 6px 8px; border: 1px solid #3b434c; background: #2c3239; color: inherit; border-radius: 4px; cursor: pointer; font: inherit; }
  #side button.on, #mSel.on { background: #5b4a2c; border-color: #c9a35a; }
  #side button:disabled { opacity: .5; }
  #selInfo { white-space: pre-wrap; word-break: break-all; font-size: 12px; color: #cfd5db; background: #1d2126; padding: 6px; border-radius: 4px; min-height: 2.8em; }
  #selBtns { display: flex; flex-wrap: wrap; gap: 4px; }
  #movedInfo { font-size: 11px; color: #e7c27a; }
  #cText { width: 100%; box-sizing: border-box; height: 72px; resize: vertical; background: #1d2126; color: inherit; border: 1px solid #3b434c;
    border-radius: 4px; font: inherit; padding: 6px; }
  #cSend { width: 100%; background: #4c5b2c !important; border-color: #9fb85a !important; }
  #side details summary { cursor: pointer; color: #f3d9a4; }
  #cList { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; }
  .citem { background: #1d2126; padding: 5px 6px; border-radius: 4px; cursor: pointer; font-size: 12px; }
  .citem:hover { background: #2a3038; }
  .citem b { display: inline-block; min-width: 18px; text-align: center; background: #d9534f; color: #fff; border-radius: 9px; font-size: 11px; }
  .citem small { color: #9aa3ad; }
  .citem a { color: #8fc1ff; }
  .citem.done { opacity: .55; } .citem.done b { background: #4c7a3c; } .citem .fix { color: #9fd08a; font-size: 11px; margin-top: 2px; }
  .pin.done { background: #4c7a3c; }
  #cTools { display: flex; gap: 4px; margin-top: 6px; align-items: center; } #cTools select { background: #1d2126; color: inherit; border: 1px solid #3b434c; border-radius: 4px; font: inherit; padding: 4px; }
  #pins { position: absolute; inset: 0; pointer-events: none; }
  .pin { position: absolute; transform: translate(-50%, -100%); min-width: 18px; height: 18px; padding: 0 4px; box-sizing: border-box;
    background: #d9534f; color: #fff; border: 2px solid #fff; border-radius: 10px 10px 10px 2px; font: bold 11px/14px sans-serif;
    text-align: center; pointer-events: auto; cursor: pointer; box-shadow: 0 1px 3px rgba(0,0,0,.6); }
  #msg { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); padding: 6px 12px;
    background: rgba(0,0,0,.6); border-radius: 4px; pointer-events: none; display: none; }
</style>
<script type="importmap">
{ "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/addons/"
} }
</script>
</head>
<body>
<div id="app">
  <div id="panel">
    <h1>건물 뷰어</h1>
    <div id="list"></div>
    <div class="modes">
      <button id="mOrbit" class="on">둘러보기</button>
      <button id="mWalk">걷기</button>
    </div>
    <div class="modes"><button id="mSel" title="Q">선택 (Q)</button></div>
    <label><input type="checkbox" id="shadow" checked> 그림자</label>
    <label><input type="checkbox" id="pixel" checked> 픽셀 (720)</label>
    <div>해 방향 <span id="azv"></span>°<input type="range" id="az" min="0" max="360" step="1" value="35"></div>
    <button id="reload">새로고침</button>
    <a href="./plan/" id="planLink" style="display:block; text-align:center; padding:7px 9px; border:1px solid #c9a35a; background:#5b4a2c; color:inherit; border-radius:4px; text-decoration:none" title="첫 배달 기획(흐름·인물·장소) 보고 코멘트">기획 →</a>
    <div id="info"></div>
  </div>
  <div id="view">
    <canvas id="c"></canvas>
    <div id="msg"></div>
    <div id="help"></div>
  </div>
  <div id="side">
    <h2>선택</h2>
    <div id="selInfo"></div>
    <div id="selBtns" style="display:none">
      <button id="tMove" class="on" title="G">옮기기 (G)</button>
      <button id="tRot" title="R">돌리기 (R)</button>
      <button id="tReset">되돌리기</button>
      <button id="tDesel" title="Esc">선택 풀기</button>
      <button id="tParent" style="display:none" title="부품이 속한 묶음(원래 오브젝트) 전체 고르기">ㄴ 부모 선택</button>
    </div>
    <div id="movedInfo"></div>
    <button id="resetAll" style="display:none">옮긴 것 전부 되돌리기</button>
    <h2>코멘트</h2>
    <textarea id="cText" placeholder="여기에 코멘트 (선택한 물건 또는 지금 화면에 대해). Ctrl+Enter = 보내기"></textarea>
    <button id="cSend">보내기</button>
    <details id="cBox" open><summary>저장된 코멘트 보기 (<span id="cCount">0</span>)</summary>
      <div id="cTools"><select id="cAll"><option value="open" selected>남은 것만</option><option value="all">전부 (적용됨·보관 포함)</option></select>
        <button id="cArchive" style="display:none" title="status=done 코멘트와 스샷을 feedback/archive/ 로 옮김">적용된 코멘트 지우기</button></div>
      <div id="cList"></div></details>
  </div>
</div>
<script type="module" src="./viewer.js"></script>
</body>
</html>
