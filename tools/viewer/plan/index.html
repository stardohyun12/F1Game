<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>PitCrew 기획 뷰어 — 3D 지도</title>
<style>
  :root { --bg:#1b1f24; --panel:#23282e; --line:#333a42; --fg:#e8e6e1; --dim:#9aa3ad; --acc:#f3d9a4; --on:#5b4a2c; --onb:#c9a35a; }
  html, body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--fg); font:13px/1.45 "Malgun Gothic","Apple SD Gothic Neo",sans-serif; }
  a { color:#8fc1ff; }
  button, select { padding:5px 9px; border:1px solid #3b434c; background:#2c3239; color:inherit; border-radius:4px; cursor:pointer; font:inherit; }
  button.on { background:var(--on); border-color:var(--onb); }
  #top { display:flex; align-items:center; gap:8px; padding:6px 12px; background:var(--panel); border-bottom:1px solid var(--line); height:28px; }
  #top h1 { font-size:15px; margin:0 8px 0 0; color:var(--acc); white-space:nowrap; }
  #top small { color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sp { flex:1; }
  #app { display:flex; height:calc(100% - 41px); }
  #left { width:360px; flex:none; background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; min-height:0; }
  #left .tabs { display:flex; gap:3px; padding:6px; border-bottom:1px solid var(--line); }
  #left .tabs button { flex:1; padding:5px 4px; }
  #leftBody { overflow-y:auto; padding:8px; flex:1; }
  #view { flex:1; position:relative; overflow:hidden; background:#111; min-width:0; }
  #c { display:block; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); }
  #c.pixel { image-rendering:pixelated; image-rendering:crisp-edges; }
  #pins { position:absolute; inset:0; pointer-events:none; overflow:hidden; }
  .pin3d { position:absolute; transform:translate(-50%,-100%); pointer-events:auto; cursor:pointer; white-space:nowrap; display:flex; align-items:center; gap:3px; font:bold 12px "Malgun Gothic",sans-serif; color:#fff; text-shadow:0 0 3px #000,0 0 3px #000; }
  .pin3d .num { min-width:20px; height:20px; padding:0 5px; box-sizing:border-box; border-radius:10px 10px 10px 2px; border:2px solid #fff; background:#e8572a; text-align:center; line-height:16px; box-shadow:0 1px 3px rgba(0,0,0,.6); text-shadow:none; }
  .pin3d.step { transform:translate(-50%,-100%) translateY(-6px); }
  .pin3d.step.on .num { background:#ffd166; color:#000; border-color:#000; }
  .pin3d.target .num { background:#ffd166; color:#000; border-color:#000; border-radius:10px; }
  .pin3d.place .num { background:#6c7a89; border-radius:10px; min-width:14px; height:14px; padding:0; line-height:10px; }
  .pin3d.place.has .num { background:#3a86ff; }
  .pin3d.place.on .num { border-color:#ffd166; border-width:3px; }
  .pin3d.route .num { background:#ff8c2a; color:#000; border-radius:4px; font-size:10px; }
  .pin3d .nm { font-size:11px; }
  .pin3d .bd { background:#d9534f; border-radius:7px; padding:0 4px; font-size:10px; line-height:14px; }
  .pin3d:hover .num { filter:brightness(1.2); }
  #mapHelp { position:absolute; left:8px; bottom:6px; font-size:11px; color:#cfd5db; background:rgba(0,0,0,.5); padding:3px 8px; border-radius:4px; pointer-events:none; max-width:70%; }
  #hud { position:absolute; left:8px; top:8px; font-size:11px; color:#cfd5db; background:rgba(0,0,0,.45); padding:2px 6px; border-radius:4px; pointer-events:none; }
  #mapBtns { position:absolute; right:8px; top:8px; display:flex; gap:4px; align-items:center; background:rgba(0,0,0,.35); padding:4px; border-radius:4px; }
  #mapBtns label { font-size:11px; display:flex; align-items:center; gap:3px; cursor:pointer; }
  #mini { position:absolute; right:8px; bottom:8px; width:200px; height:200px; border:1px solid #556; border-radius:4px; background:#1a2a36; cursor:crosshair; box-shadow:0 1px 6px rgba(0,0,0,.6); }
  #save.dirty { background:#5b3a2c; border-color:#ffb347; color:#ffd9a8; font-weight:bold; }
  #editBar { position:absolute; right:8px; top:42px; width:380px; max-width:calc(100% - 16px); }
  #selPanel { background:rgba(0,0,0,.6); border:1px solid #6b5a3c; border-radius:4px; padding:6px 8px; font-size:11px; color:#e8e6e1; }
  #selPanel .ttl { font-size:12px; color:#f3d9a4; margin-bottom:3px; }
  #selPanel .coords { font:12px/1.6 Consolas,"Malgun Gothic",monospace; white-space:pre; color:#fff; background:rgba(255,255,255,.06); border-radius:3px; padding:2px 6px; }
  #selPanel .coords b { color:#ffd166; }
  #selPanel .dim { color:#aab3bd; margin:3px 0; }
  #selPanel .chg { color:#ffb347; margin:3px 0; }
  #selPanel .row { display:flex; gap:3px; flex-wrap:wrap; margin-top:4px; }
  #selPanel .row button, #selPanel .mini { font-size:11px; padding:2px 6px; }
  #right { width:400px; flex:none; background:var(--panel); border-left:1px solid var(--line); overflow-y:auto; padding:10px; box-sizing:border-box; display:none; }
  #right.open { display:block; }
  .card { background:#1d2126; border:1px solid var(--line); border-radius:6px; padding:8px 10px; margin-bottom:8px; }
  .card h2 { margin:0 0 6px; font-size:14px; color:var(--acc); display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .card h3 { margin:8px 0 3px; font-size:12px; color:var(--acc); }
  .field { padding:3px 5px; border-radius:4px; margin:1px 0; }
  .field:hover, .line:hover, .srow:hover { background:#2a3038; }
  .field .k { color:var(--dim); font-size:11px; margin-right:6px; }
  .field .v { white-space:pre-wrap; }
  .line { padding:2px 5px; border-radius:4px; }
  .line .who { color:#e7c27a; font-weight:bold; margin-right:5px; }
  .cbtn { font-size:10px; padding:0 5px; margin-left:5px; opacity:.5; vertical-align:middle; line-height:16px; }
  .field:hover .cbtn, .line:hover .cbtn, h2 .cbtn, .ref:hover .cbtn, .srow:hover .cbtn { opacity:1; }
  .cbtn.has { opacity:1; background:#4c3b2c; border-color:#c9a35a; }
  .badge { display:inline-block; min-width:14px; padding:0 4px; background:#d9534f; color:#fff; border-radius:8px; font-size:10px; text-align:center; }
  .badge.zero { display:none; }
  .status { font-size:10px; color:#c9a35a; border:1px solid #6b5a3c; border-radius:3px; padding:0 4px; }
  .shot { width:100%; border-radius:4px; background:#111; image-rendering:pixelated; display:block; cursor:zoom-in; margin-top:4px; }
  .refs { display:flex; gap:4px; margin:4px 0; }
  .ref { position:relative; flex:1; min-width:0; }
  .ref img { width:100%; height:92px; object-fit:cover; border-radius:4px; background:#111; display:block; cursor:zoom-in; }
  .ref .num { position:absolute; left:3px; top:3px; background:rgba(0,0,0,.7); color:#fff; border-radius:8px; padding:0 5px; font-size:10px; }
  .ref .cbtn { position:absolute; right:3px; top:3px; margin:0; }
  .ref small { display:block; color:var(--dim); font-size:10px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .noref { color:#666; font-size:11px; padding:4px; border:1px dashed #333a42; border-radius:4px; }
  .srow { display:flex; gap:8px; align-items:center; padding:5px 6px; border-radius:4px; cursor:pointer; border:1px solid transparent; }
  .srow.on { border-color:var(--onb); background:#2d2a22; }
  .srow .n { width:20px; height:20px; border-radius:10px; background:#e8572a; color:#fff; font-weight:bold; text-align:center; line-height:20px; flex:none; font-size:11px; }
  .srow .n.pin { background:#3a86ff; border-radius:4px; }
  .srow img { width:56px; height:34px; object-fit:cover; border-radius:3px; background:#111; flex:none; image-rendering:pixelated; }
  .srow .t { flex:1; min-width:0; } .srow .t small { display:block; color:var(--dim); font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .mapbtn { font-size:10px; padding:0 5px; }
  .cbox { margin:3px 0 6px; background:#15181c; border:1px solid var(--line); border-radius:4px; padding:5px; }
  .cbox textarea { width:100%; box-sizing:border-box; height:50px; resize:vertical; background:#1d2126; color:inherit; border:1px solid #3b434c; border-radius:4px; font:inherit; padding:4px; }
  .cbox .row { display:flex; gap:5px; margin-top:4px; align-items:center; }
  .cbox .send { background:#4c5b2c; border-color:#9fb85a; }
  .cbox .path { color:#666; font-size:10px; flex:1; }
  .clist { margin-top:3px; }
  .citem { font-size:11px; padding:2px 5px; border-left:3px solid #d9534f; margin:2px 0; background:#15181c; border-radius:0 4px 4px 0; }
  .citem.done { opacity:.5; border-left-color:#4c7a3c; }
  .citem small { color:var(--dim); } .citem .fix { color:#9fd08a; }
  #leftBody .citem { cursor:pointer; }
  #msg { position:fixed; top:44px; left:50%; transform:translateX(-50%); padding:6px 12px; background:rgba(0,0,0,.75); border-radius:4px; display:none; z-index:9; }
  #lightbox { position:fixed; inset:0; background:rgba(0,0,0,.85); display:none; align-items:center; justify-content:center; z-index:20; cursor:zoom-out; }
  #lightbox img { max-width:95vw; max-height:92vh; }
  #lightbox div { position:absolute; bottom:10px; left:0; right:0; text-align:center; color:#ccc; font-size:12px; }
</style>
</head>
<body>
<div id="top">
  <h1>기획 뷰어</h1>
  <select id="quest" title="퀘스트"></select>
  <select id="cFilter" title="코멘트 표시"><option value="open" selected>남은 것만</option><option value="all">전부 (적용됨 포함)</option></select>
  <button id="reload" title="YAML·코멘트 다시 읽기">새로고침</button>
  <button id="save" title="배치 저장 → docs/design/tutorial/placements.yaml (Ctrl+S)">저장</button><span id="dirtyDot" title="저장 안 한 배치 변경" style="display:none;color:#ffb347;font-weight:bold">●</span>
  <span class="sp"></span>
  <small id="meta"></small>
  <a href="../" style="margin-left:8px; white-space:nowrap">건물 뷰어 →</a>
</div>
<div id="app">
  <div id="left">
    <div class="tabs">
      <button data-tab="flow" class="on">흐름</button>
      <button data-tab="chars">인물</button>
      <button data-tab="places">장소</button>
      <button data-tab="allc">코멘트 <span id="cTotal" class="badge zero">0</span></button>
    </div>
    <div id="leftBody"></div>
  </div>
  <div id="view">
    <canvas id="c"></canvas>
    <div id="pins"></div>
    <div id="hud"></div>
    <div id="mapBtns">
      <button id="mOrbit" class="on" title="1">둘러보기</button><button id="mWalk" title="2">걷기</button>
      <button id="mEdit" title="E — 건물·핀 배치 편집 (Unity 식 기즈모)">배치</button>
      <button id="fit" title="F — 튜토리얼 구간에 맞춤">맞춤</button>
      <label title="P"><input type="checkbox" id="pixel" checked> 픽셀 720</label>
    </div>
    <div id="editBar" style="display:none"><div id="selPanel"></div></div>
    <canvas id="mini" width="200" height="200" title="미니맵 — 클릭하면 그 자리로"></canvas>
    <div id="mapHelp"></div>
  </div>
  <div id="right"></div>
</div>
<div id="msg"></div>
<div id="lightbox"><img alt=""><div></div></div>
<script type="importmap">
{ "imports": { "three": "../vendor/three.module.js", "three/addons/": "../vendor/addons/" } }
</script>
<script type="module" src="./plan.js"></script>
</body>
</html>
