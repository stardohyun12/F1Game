<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><script>try{document.documentElement.dataset.theme=localStorage.getItem("pitcrew.theme")||"light"}catch{}</script><meta name="viewport" content="width=device-width,initial-scale=1"><title>PitCrew — AI 팀 워크스페이스</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%230969da%27/%3E%3Ctext x=%2716%27 y=%2723%27 font-family=%27Arial%27 font-weight=%27900%27 font-size=%2720%27 text-anchor=%27middle%27 fill=%27white%27%3EP%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="/app.css"><link rel="stylesheet" href="/product.css"></head>
<body><a class="skip-chat" href="#prompt">입력창으로 이동</a>
<header class="appbar"><button id="navToggle" class="icon" aria-label="프로젝트와 대화 목록">☰</button><a class="brand" href="/">P<span class="brand-dot">●</span> <strong>PITCREW</strong><span class="brand-tag">WORKSPACE</span></a><div class="project"><span class="project-dot"></span><span id="projectName">로컬 프로젝트</span></div><nav><a href="/studio">게임 제작 작업실 ↗</a><button id="setupOpen" class="quiet" data-setup-action="start">시작 안내</button><button id="usageOpen" aria-label="Codex와 Claude 사용량">사용량</button><button id="themeToggle" class="icon" aria-label="화면 테마 변경">◐</button><button id="sourcesOpen" class="quiet">대화 가져오기 <span>↗</span></button><a href="/legacy" target="_blank" rel="noopener">기존 관제탑 ↗</a></nav><span id="connection" class="connection">연결 중</span></header>
<button id="navShade" aria-label="프로젝트 메뉴 닫기" tabindex="-1"></button><main class="workspace">
  <aside class="sidebar"><div class="project-switcher"><label for="projectSelect">프로젝트</label><select id="projectSelect" aria-label="프로젝트 선택"><option value="default">불러오는 중…</option></select><button id="projectsOpen" class="quiet">프로젝트 관리 ＋</button></div><div class="side-title"><span>팀과 대화</span><button id="newAgent" class="icon" title="에이전트 추가" aria-label="에이전트 추가">＋</button></div><div class="side-note">역할마다 독립된 대화와 컨텍스트</div><div class="team-controls"><label for="teamFilter">팀 선택</label><select id="teamFilter" aria-label="팀 선택"><option value="">전체 대화</option></select><button id="manageTeams">팀 만들기 · 관리</button><button id="importChats">대화 가져오기</button></div><div id="teamFilterNote" class="team-filter-note hidden"></div><div class="conversation-search"><input id="chatSearch" type="search" aria-label="대화 이름·역할 검색" placeholder="이름·역할 찾기 · Ctrl+K"><button id="clearChatSearch" class="icon hidden" aria-label="검색 지우기">×</button></div><div id="agents" class="agents"></div><details class="sidebar-tools"><summary>도구 · 제거한 대화 복원</summary><div class="side-bottom"><button id="sharedOpen" class="side-action">◈ <span>전체 공통 컨텍스트</span></button><button id="activityOpen" class="side-action">≋ <span>활동 기록</span></button><button id="archivedOpen" class="side-action">▣ <span>보관된 대화</span></button><button id="helpOpen" class="side-action">? <span>연결 및 사용 안내</span></button></div></details><div id="teamSummary" class="team-summary"></div></aside>
  <section class="conversation">
    <div id="workspaceTabs" class="workspace-tabs" aria-label="열린 대화"></div><div class="conversation-head"><div id="selectedAvatar" class="avatar"></div><div class="conversation-title"><h1 id="selectedName">팀을 불러오는 중</h1><div id="selectedMeta" class="muted"></div></div><div class="head-actions"><button id="findInChat" class="quiet" title="대화 내 찾기 · Ctrl+Shift+F">찾기</button><button id="compareOpen" class="quiet" title="다른 대화 나란히 보기">◫ 비교</button><button id="settingsOpen" class="quiet">설정</button><button id="contextToggle" class="icon" aria-label="컨텍스트 패널 토글">☷</button></div></div>
    <div id="syncNotice" class="sync-notice hidden" role="status"><span id="syncMessage"></span><button id="retryConnection" type="button">지금 다시 연결</button></div>
    <div class="runtime-bar"><span id="runtimeSummary">실행 서비스 확인 중</span><button id="teamOpen" type="button">팀 상태 · 전체 보기 ↗</button></div>
    <div id="modelBar" class="model-bar"></div>
    <div id="chatFindBar" class="chat-find hidden"><input id="chatFindInput" type="search" aria-label="현재 대화 본문 검색" placeholder="현재 대화 본문 찾기"><span id="chatFindCount" role="status"></span><button id="chatFindPrev" aria-label="이전 검색 결과">↑</button><button id="chatFindNext" aria-label="다음 검색 결과">↓</button><button id="chatFindClose" aria-label="본문 검색 닫기">×</button></div><div class="chat-columns"><div class="main-chat"><div id="messages" class="messages" aria-live="polite"></div><button id="jumpLatest" class="jump hidden">최신 메시지 ↓</button></div><section id="comparePanel" class="compare-panel hidden"><div class="compare-title"><strong id="compareName"></strong><button id="compareClose" class="icon" aria-label="비교 닫기">×</button></div><div id="compareMessages" class="messages"></div></section></div>
    <div id="agentNotice" class="agent-notice hidden" role="status"></div>
    <div id="approvals" class="approvals"></div>
    <div id="observerNotice" class="observer-notice hidden">외부 대화 기록 · 맥락을 전달하거나 원래 세션을 이어갈 수 있습니다. <button id="resumeSource" class="primary hidden">원래 세션 이어서 사용</button></div>
    <div id="queueBar" class="queue-bar hidden" aria-live="polite"></div><form id="composer" class="composer"><div id="references" class="references"></div><div id="attachments" class="attachments" aria-live="polite"></div><input type="file" id="attachInput" multiple hidden><label id="composeTarget" for="prompt" class="sr-only">메시지</label><textarea id="prompt" rows="3" placeholder="목표를 알려주세요. 이 에이전트에게만 전달됩니다." aria-describedby="composeHint"></textarea><div class="compose-bottom"><span id="composeHint">Enter 전송 · Shift+Enter 줄바꿈</span><div><button type="button" id="attach" class="quiet attach-button" aria-label="파일 첨부" title="파일 첨부 · 이미지는 붙여넣기(Ctrl+V)나 끌어놓기도 됩니다"></button><button type="button" id="stop" class="danger hidden">■ 중단</button><button type="submit" id="send" class="primary">보내기 <span>↑</span></button></div></div></form>
  </section>
  <aside id="contextPanel" class="context-panel"><div class="context-head"><span>컨텍스트</span><button id="contextClose" class="icon" aria-label="컨텍스트 닫기">×</button></div><div id="contextContent"></div></aside>
</main>
<dialog id="modal" aria-labelledby="modalTitle"><div class="modal-head"><div><span class="eyebrow" id="modalEyebrow">PITCREW</span><h2 id="modalTitle"></h2></div><button id="modalClose" class="icon" aria-label="닫기">×</button></div><div id="modalContent"></div></dialog>
<div id="toast" class="toast hidden" role="status"></div>
<script src="/connection.js"></script><script src="/markdown-it.min.js"></script><script src="/reader.js"></script><script src="/app.js"></script><script src="/notify.js"></script><script src="/queue.js"></script><script src="/attach.js"></script><script src="/composer.js"></script><script src="/teams.js"></script><script src="/workspace.js"></script><script src="/organize.js"></script>
</body></html>
