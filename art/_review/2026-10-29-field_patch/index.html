<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>밭 게임 화면 목업 · 승인 대기</title><style>body{margin:32px auto;max-width:1500px;padding:0 20px;background:#e7e3d9;color:#303d36;font:17px/1.7 sans-serif}a{color:inherit}img{width:100%;display:block}section{display:grid;grid-template-columns:1fr 1fr;gap:24px}h1{font-size:30px}p{max-width:1000px}b{display:block} @media(max-width:700px){section{grid-template-columns:1fr}}</style><h1>밭 / 게임 화면 목업</h1><p>도현 승인 필요 — A: 8×6m, 곧은 4줄 / B: 10×7m, 비탈에 휜 4줄. 모든 컷은 F1Studio의 실제 A7 조명·720p Kuwahara 화면이다. 본제작·원본 맵 적용은 하지 않았다.</p><a href="mock_sheet.png"><img src="mock_sheet.png" alt="원본과 A/B 4장 비교 시트"></a><h2>1280×720 원본 보기</h2><section><a href="A_high.png"><img src="A_high.png" alt="A_high"><b>A 상부</b></a><a href="A_eye.png"><img src="A_eye.png" alt="A_eye"><b>A 눈높이</b></a><a href="B_high.png"><img src="B_high.png" alt="B_high"><b>B 상부</b></a><a href="B_eye.png"><img src="B_eye.png" alt="B_eye"><b>B 눈높이</b></a></section><p>눈높이에서는 줄이 겹쳐 차이가 약하며, 실제 Map_TownV6 경사지 접지는 검증하지 않았다. 승인 후 본제작과 QA/프로그래밍 임포트 필요.</p><p><a href="concept.png">반려된 1차 도식</a> · <a href="color_samples.json">원본 색 표본</a> · <a href="verification.json">Unity 측정 결과</a> · <a href="../../../docs/team/reports/art-20261029-2328.md">보고서</a></p></html>
